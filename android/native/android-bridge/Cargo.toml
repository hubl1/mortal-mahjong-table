[package]
name = "mortal-android-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
name = "mortal_android"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.21"
ndarray = "0.16"
serde_json = "1"
riichi = { package = "libriichi", path = "../upstream/libriichi", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

